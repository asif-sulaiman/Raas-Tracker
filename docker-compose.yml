services:
  raas-tracker:
    build: .
    ports:
      - "5000:5000"
    environment:
      RAAS_SECRET: ${RAAS_SECRET:?Set RAAS_SECRET before starting}
      PRODUCTION: "1"
      FORCE_HTTPS: "0"
      COOKIE_SECURE: "0"
    volumes:
      - raas-tracker-data:/data
    restart: unless-stopped

volumes:
  raas-tracker-data:
