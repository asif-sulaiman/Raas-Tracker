services:
  chemcalc:
    build: .
    ports:
      - "5000:5000"
    environment:
      CHEMCALC_SECRET: ${CHEMCALC_SECRET:?Set CHEMCALC_SECRET before starting}
      PRODUCTION: "1"
      FORCE_HTTPS: "0"
      COOKIE_SECURE: "0"
    volumes:
      - chemcalc-data:/data
    restart: unless-stopped

volumes:
  chemcalc-data:
